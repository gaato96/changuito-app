# Requiere el secreto DATABASE_URL (Settings → Secrets and variables → Actions).
# Precios de Vea, Jumbo y La Anónima desde SEPA (datos oficiales, CC-BY 4.0).
# CKAN publica el archivo diario cerca de las 16:20; se consulta 2 veces y se procesa solo si hay uno nuevo.
name: ingest-sepa

on:
  schedule:
    - cron: '0 17 * * *'   # 14:00 ART
    - cron: '0 23 * * *'   # 20:00 ART
  workflow_dispatch:
    inputs:
      force:
        description: 'procesar aunque ya se haya procesado (true/false)'
        default: 'false'

concurrency:
  group: ingest-sepa
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ingesta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then extra=--force; fi
          node ingest/sepa/run.ts $extra
